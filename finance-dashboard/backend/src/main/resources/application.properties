# Server configuration
server.port=8080
server.servlet.context-path=/

# Spring Application Name
spring.application.name=


# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/finance_dashboard_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JSON Jackson configuration
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

# Logging
logging.level.com.finance.dashboard=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
